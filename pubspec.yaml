name: focus_friend_app
description: "An Android-first cozy focus room prototype."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  intl: any

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # List files one by one: these folders also hold unused drafts and prompts.
    - assets/audio/
    - assets/images/immersive/room-morning.png
    - assets/images/immersive/room-day.png
    - assets/images/immersive/room-evening.png
    - assets/images/immersive/room-night.png
    - assets/images/immersive/reward-plant.png
    - assets/images/immersive/reward-mug.png
    - assets/images/immersive/reward-lamp.png
    - assets/images/immersive/nav-desk.png
    - assets/images/immersive/nav-records.png
    - assets/images/immersive/nav-settings.png
    - assets/images/immersive/redpanda-reference.png
    - assets/images/immersive/redpanda-slow-connected-body-38.png
    - assets/images/immersive/redpanda-fixed-notebook.png
    - assets/images/rest/redpanda-tea-sheet.png
    - assets/images/rest/redpanda-tea-inbetweens.png
    - assets/images/rest/closed-book.png
    - assets/images/companion-portrait.png
    - assets/images/friends/penguin-scene.png
    - assets/images/friends/otter-scene.png
    - assets/images/friends/squirrel-scene.png
    - assets/images/friends/fennec-scene.png
