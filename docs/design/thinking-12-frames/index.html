<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>랫서팬더 · 생각하기 12프레임</title>
<style>
:root{color-scheme:light;--ink:#493425;--green:#2e6652;--muted:#8a7766}
*{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
main{max-width:1100px;margin:auto;padding:34px 24px 50px}header{margin-bottom:25px}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--green);font-weight:700}
h1{font-size:29px;letter-spacing:-.04em;margin:10px 0}p{line-height:1.65;color:var(--muted);margin:0}
.review{display:grid;grid-template-columns:420px 1fr;gap:32px;align-items:start}
.player{background:#fffdf7;border:1px solid #e7dfd1;border-radius:22px;padding:22px;text-align:center;position:sticky;top:20px}
#preview{width:100%;height:auto;max-width:362px;aspect-ratio:1;display:block;margin:auto;border-radius:12px}
.status{display:flex;justify-content:space-between;margin:16px 0;font-size:14px;font-variant-numeric:tabular-nums}.status span{color:var(--muted)}
.controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
button,select{font:inherit;border:1px solid #d5cbbc;border-radius:10px;padding:10px 12px;background:#fffdf8;color:var(--ink);cursor:pointer}
button:hover,select:hover{border-color:var(--green)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ca994d;outline-offset:3px}
#toggle{background:var(--green);color:white;border-color:var(--green);min-width:90px}#mode{width:100%;margin-bottom:12px}
input{width:100%;accent-color:var(--green);margin:20px 0 6px}.help{font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.frame{padding:0;overflow:hidden;border-radius:13px;text-align:left;background:#fffdf8;border:2px solid transparent;box-shadow:0 1px 0 #ded6ca}
.frame[aria-pressed="true"]{border-color:var(--green)}.frame img{width:100%;height:auto;display:block}.frame span{display:block;font-size:12px;padding:4px 10px 8px;color:var(--muted)}
.grid-title{font-size:16px;margin:2px 0 14px}footer{display:flex;gap:18px;flex-wrap:wrap;margin-top:25px;font-size:13px}a{color:var(--green);text-underline-offset:3px}
@media(max-width:850px){.review{grid-template-columns:1fr}.player{position:static;max-width:430px;width:100%;margin:auto}.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:480px){main{padding:24px 16px 40px}h1{font-size:24px}.player{padding:16px}.grid{gap:7px;grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><main>
<header><div class="eyebrow">FOCUS FRIEND · MOTION STUDY</div><h1>잠깐 생각하고, 다시 쓰기</h1><p>턱을 괴고 시선을 옮기며 잠시 생각합니다. 필기·페이지 넘기기와 이어지는 흐름도 함께 확인해 보세요.</p></header>
<section class="review" aria-label="생각하기 동작 미리보기"><div class="player">
<select id="mode" aria-label="동작 선택"><option value="thinking">생각하기만 · 12장</option><option value="writing_thinking">필기 + 생각하기 연결</option><option value="routine">필기 + 생각하기 + 페이지 넘기기</option><option value="writing">필기만 · 12장</option><option value="page">페이지 넘기기만 · 12장</option></select>
<img id="preview" src="frames/frame-01.png" width="362" height="362" alt="랫서팬더 생각하기 1번 프레임">
<div class="status"><strong id="action">생각하기 · 01 / 12</strong><span id="timing">12 fps · 2초 반복</span></div>
<div class="controls"><button id="prev" aria-label="이전 그림">←</button><button id="toggle">일시정지</button><button id="next" aria-label="다음 그림">→</button><select id="speed" aria-label="재생 속도"><option value="12">보통 · 12 fps</option><option value="6">느리게 · 6 fps</option></select></div>
<input id="scrub" type="range" min="1" max="24" value="1" aria-label="재생 위치">
<p class="help">스페이스: 재생 / 정지 · 방향키: 한 장씩 보기</p>
</div><div><h2 class="grid-title">생각하기 12프레임 <span style="font-weight:400;color:var(--muted)">· 눌러서 보기</span></h2><div class="grid">
<button class="frame" data-index="0" aria-label="생각하기 1번 프레임 보기" aria-pressed="true"><img src="frames/frame-01.png" width="362" height="362" alt=""><span>01</span></button>
<button class="frame" data-index="1" aria-label="생각하기 2번 프레임 보기" aria-pressed="false"><img src="frames/frame-02.png" width="362" height="362" alt=""><span>02</span></button>
<button class="frame" data-index="2" aria-label="생각하기 3번 프레임 보기" aria-pressed="false"><img src="frames/frame-03.png" width="362" height="362" alt=""><span>03</span></button>
<button class="frame" data-index="3" aria-label="생각하기 4번 프레임 보기" aria-pressed="false"><img src="frames/frame-04.png" width="362" height="362" alt=""><span>04</span></button>
<button class="frame" data-index="4" aria-label="생각하기 5번 프레임 보기" aria-pressed="false"><img src="frames/frame-05.png" width="362" height="362" alt=""><span>05</span></button>
<button class="frame" data-index="5" aria-label="생각하기 6번 프레임 보기" aria-pressed="false"><img src="frames/frame-06.png" width="362" height="362" alt=""><span>06</span></button>
<button class="frame" data-index="6" aria-label="생각하기 7번 프레임 보기" aria-pressed="false"><img src="frames/frame-07.png" width="362" height="362" alt=""><span>07</span></button>
<button class="frame" data-index="7" aria-label="생각하기 8번 프레임 보기" aria-pressed="false"><img src="frames/frame-08.png" width="362" height="362" alt=""><span>08</span></button>
<button class="frame" data-index="8" aria-label="생각하기 9번 프레임 보기" aria-pressed="false"><img src="frames/frame-09.png" width="362" height="362" alt=""><span>09</span></button>
<button class="frame" data-index="9" aria-label="생각하기 10번 프레임 보기" aria-pressed="false"><img src="frames/frame-10.png" width="362" height="362" alt=""><span>10</span></button>
<button class="frame" data-index="10" aria-label="생각하기 11번 프레임 보기" aria-pressed="false"><img src="frames/frame-11.png" width="362" height="362" alt=""><span>11</span></button>
<button class="frame" data-index="11" aria-label="생각하기 12번 프레임 보기" aria-pressed="false"><img src="frames/frame-12.png" width="362" height="362" alt=""><span>12</span></button>
</div></div></section>
<footer><a href="thinking-loop.gif">생각하기 GIF</a><a href="writing-and-thinking.gif">필기와 연결 GIF</a><a href="study-routine.mp4">전체 동작 영상</a><a href="thinking-contact-sheet.png">생각하기 12장 전체</a><a href="study-motion-assets.zip" download>전체 프레임 다운로드</a></footer>
</main><script src="timeline.js"></script><script>
const labels={thinking:'생각하기',writing:'필기하기',page:'페이지 넘기기'},paths={thinking:'frames',writing:'writing-frames',page:'page-frames'},images={};
for(const kind of Object.keys(labels))images[kind]=Array.from({length:12},(_,i)=>{const im=new Image();im.src=paths[kind]+'/frame-'+String(i+1).padStart(2,'0')+'.png';return im});
const preview=document.querySelector('#preview'),action=document.querySelector('#action'),scrub=document.querySelector('#scrub'),toggle=document.querySelector('#toggle'),mode=document.querySelector('#mode'),speed=document.querySelector('#speed'),cards=[...document.querySelectorAll('.frame')];
let queue=window.studyTimelines.thinking,index=0,fps=12,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,epoch=performance.now();
function show(n){index=((n%queue.length)+queue.length)%queue.length;const item=queue[index];preview.src=images[item.kind][item.index].src;preview.alt='랫서팬더 '+labels[item.kind]+' '+(item.index+1)+'번 프레임';action.textContent=item.label+' · '+String(item.index+1).padStart(2,'0')+' / 12';scrub.value=index+1;cards.forEach((c,i)=>c.setAttribute('aria-pressed',item.kind==='thinking'&&i===item.index?'true':'false'))}
function state(){toggle.textContent=playing?'일시정지':'재생';document.querySelector('#timing').textContent=fps+' fps · '+Number((queue.length/fps).toFixed(2))+'초 반복'}
function reset(){queue=window.studyTimelines[mode.value];scrub.max=queue.length;epoch=performance.now();show(0);state()}
function pauseAt(n){playing=false;show(n);state()}
function step(delta){const current=queue[index];let n=index;for(let count=0;count<queue.length;count++){n=(n+delta+queue.length)%queue.length;if(queue[n].kind!==current.kind||queue[n].index!==current.index)break}pauseAt(n)}
mode.onchange=reset;
toggle.onclick=()=>{playing=!playing;epoch=performance.now()-index*1000/fps;state()};
document.querySelector('#prev').onclick=()=>step(-1);
document.querySelector('#next').onclick=()=>step(1);
scrub.oninput=()=>pauseAt(Number(scrub.value)-1);
cards.forEach((card,i)=>card.onclick=()=>{mode.value='thinking';reset();pauseAt(queue.findIndex(item=>item.index===i))});
speed.onchange=()=>{fps=Number(speed.value);epoch=performance.now()-index*1000/fps;state()};
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();toggle.click()}if(e.code==='ArrowLeft'){e.preventDefault();step(-1)}if(e.code==='ArrowRight'){e.preventDefault();step(1)}});
function tick(t){if(playing){const n=Math.floor((t-epoch)*fps/1000)%queue.length;if(n!==index)show(n)}requestAnimationFrame(tick)}
Promise.all(Object.values(images).flat().map(im=>im.decode())).then(()=>{reset();requestAnimationFrame(tick)}).catch(()=>{playing=false;state();document.querySelector('#timing').textContent='이미지를 불러오지 못했습니다'});
</script></body></html>
