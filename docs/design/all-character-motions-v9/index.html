<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전체 친구 모션 · 통합 적용</title>
<style>
@font-face{font-family:Pretendard;src:url('/assets/fonts/PretendardVariable.ttf');font-weight:100 900}
*{box-sizing:border-box}body{margin:0;background:#fff8eb;color:#382b26;font-family:Pretendard,system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:26px 22px 40px}h1{font-size:27px;letter-spacing:-.7px;margin:0 0 8px}p{line-height:1.6;color:#756458;margin:7px 0}.toolbar{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:22px 0 16px}.group{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;min-height:44px;padding:10px 14px;border:1px solid #d9c7ab;border-radius:11px;color:#382b26;background:#fffdf7;cursor:pointer}button[aria-pressed=true]{background:#ffc779;border-color:#e2a551;font-weight:700}button:focus-visible,a:focus-visible{outline:3px solid #896847;outline-offset:3px}.gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{min-width:0;padding:12px;border:1px solid #e4d5bf;background:#fffcf5;border-radius:17px}.card h2{font-size:20px;margin:1px 0 10px}.card .modes{display:flex;gap:5px;margin-bottom:10px}.modes button{flex:1;padding:8px 7px;font-size:14px}.media{aspect-ratio:490/462;background:#4b3c31;border-radius:12px;overflow:hidden}.media video,.media img{display:block;width:100%;height:100%;object-fit:contain}.media [hidden]{display:none}.meta{font-size:13px;min-height:20px;margin:10px 0 4px}.note{font-size:13px;min-height:42px;margin:0 0 9px;line-height:1.5}.issue{color:#875320}.expand{width:100%;font-size:14px}.status{font-size:14px;margin:17px 0 7px}.foot{font-size:13px;margin-top:10px}a{color:#80552d}dialog{border:1px solid #d9c7ab;border-radius:18px;background:#fff8eb;color:#382b26;padding:18px;max-width:min(740px,94vw);width:740px}dialog::backdrop{background:#201a17b8}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.dialog-head h2{font-size:21px;margin:0}dialog .media{max-height:64vh;margin-inline:auto}dialog .note{min-height:0;margin-top:10px}.loading{padding:20px;background:#f5ebd8;border-radius:12px}@media(max-width:800px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:690px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:22px 14px}.toolbar{margin-top:16px}}@media(max-width:430px){.gallery{grid-template-columns:1fr}.card{padding:14px}}
</style>
<main>
  <h1>전체 친구 모션 · 통합 적용</h1>
  <p>쉬는 리듬과 새 마시기 그림을 함께 적용한 다섯 친구예요. 모두 원래 속도 1배로 움직여요.</p>
  <div class="toolbar">
    <div class="group" aria-label="전체 모션 종류">
      <button id="rest-all" aria-pressed="true">전체 휴식</button>
      <button id="study-all" aria-pressed="false">전체 집중 · 필기와 페이지 넘김</button>
      <button id="page-step" hidden>페이지 넘김 순간 보기</button>
    </div>
    <div class="group" aria-label="전체 재생 제어">
      <button id="play-all">모두 재생</button>
      <button id="pause-all">모두 멈춤</button>
      <button id="restart-all">처음부터</button>
    </div>
  </div>
  <div id="gallery" class="gallery"><p class="loading">현재 앱 모션을 불러오고 있어요.</p></div>
  <p id="status" class="status" role="status" aria-live="polite">휴식 · 원래 속도 1배</p>
  <p class="foot">집중은 필기·페이지 넘김 전체 주기, 휴식은 모든 리듬 변형을 한 바퀴 담았어요. 캐릭터마다 주기가 달라 동작 시점은 서로 달라요.</p>
  <p class="foot">다람쥐·사막여우의 집중은 기존의 정지 장면이에요. 휴식에는 고정된 귀·꼬리·등과 새 마시기 사이 그림을 적용했어요.</p>
  <p class="foot"><a href="README.md">현재 적용 범위와 캡처 기록</a></p>
</main>
<dialog id="detail" aria-labelledby="detail-title">
  <div class="dialog-head"><h2 id="detail-title"></h2><button id="close-detail" aria-label="크게 보기 닫기">닫기</button></div>
  <div class="media"><video id="detail-video" controls muted loop playsinline hidden></video><img id="detail-image" alt="" hidden></div>
  <p id="detail-note" class="note"></p>
</dialog>
<script>
const friends=[['redpanda','랫서팬더'],['penguin','펭귄'],['otter','해달'],['squirrel','다람쥐'],['fennec','사막여우']];
const cards=new Map();let records=[];let desiredPlaying=!matchMedia('(prefers-reduced-motion: reduce)').matches;let resumeAfterDetail=[];
const gallery=document.querySelector('#gallery'),status=document.querySelector('#status'),detail=document.querySelector('#detail'),detailVideo=document.querySelector('#detail-video'),detailImage=document.querySelector('#detail-image');
const record=(id,mode)=>records.find(x=>x.friend===id&&x.mode===mode);
const seconds=n=>Number(n.toFixed(2));
const noteFor=(id,mode)=>mode==='study'?(record(id,mode).static?'현재 앱의 집중 기본 자세 · 정지 장면':'필기 36초 → 페이지 넘김 '+(id==='redpanda'?'5.5':'4.5')+'초'):(id==='redpanda'?'기존의 차 마시기·휴식 모션':id==='penguin'?'7.17 · 7.5 · 7.67초의 세 가지 리듬':id==='otter'?'8 · 9 · 10 · 11초의 네 가지 리듬':'18 · 19 · 20초의 리듬 · 마시기 사이 그림과 고정된 몸');
function play(video){video.playbackRate=1;return video.play().catch(()=>{});}
function updateOverall(){const modes=[...cards.values()].map(c=>c.mode),same=modes.every(x=>x===modes[0]);document.querySelector('#rest-all').setAttribute('aria-pressed',String(same&&modes[0]==='rest'));document.querySelector('#study-all').setAttribute('aria-pressed',String(same&&modes[0]==='study'));document.querySelector('#page-step').hidden=!(same&&modes[0]==='study');status.textContent=(same?(modes[0]==='rest'?'전체 휴식 · 5종':'전체 집중 · 모션 3종 / 정지 장면 2종'):'캐릭터별 집중·휴식 비교')+' · 원래 속도 1배';}
function setMode(card,mode){card.mode=mode;const r=record(card.id,mode),stem=card.id+'-'+mode;card.video.pause();card.video.hidden=r.static;card.image.hidden=!r.static;card.section.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));if(r.static){card.video.removeAttribute('src');card.video.load();card.image.src='capture/'+stem+'-poster.png';card.image.alt=card.name+' 집중 정지 장면';}else{card.video.poster='capture/'+stem+'-poster.png';card.video.src='capture/'+stem+'.mp4';card.video.load();if(desiredPlaying)play(card.video);}card.section.querySelector('.meta').textContent=r.static?'집중 · 정지 장면':(mode==='rest'?'휴식 · '+seconds(r.cycleSeconds)+'초 전체 주기':'집중 · '+seconds(r.clipSeconds)+'초 전체 주기');const note=card.section.querySelector('.note');note.textContent=noteFor(card.id,mode);note.classList.remove('issue');updateOverall();}
function openDetail(card){const r=record(card.id,card.mode);resumeAfterDetail=[...cards.values()].filter(c=>!c.video.hidden&&!c.video.paused).map(c=>c.video);cards.forEach(c=>c.video.pause());document.querySelector('#detail-title').textContent=card.name+' · '+(card.mode==='rest'?'휴식':'집중');document.querySelector('#detail-note').textContent=noteFor(card.id,card.mode);detailVideo.hidden=r.static;detailImage.hidden=!r.static;if(r.static){detailImage.src=card.image.src;detailImage.alt=card.image.alt;}else{detailVideo.src=card.video.src;detailVideo.poster=card.video.poster;const time=card.video.currentTime;detailVideo.addEventListener('loadedmetadata',()=>{detailVideo.currentTime=Math.min(time,detailVideo.duration-.01);if(desiredPlaying)play(detailVideo);},{once:true});detailVideo.load();}detail.showModal();}
detail.addEventListener('close',()=>{detailVideo.pause();resumeAfterDetail.forEach(play);resumeAfterDetail=[];});document.querySelector('#close-detail').onclick=()=>detail.close();
document.querySelector('#rest-all').onclick=()=>cards.forEach(c=>setMode(c,'rest'));document.querySelector('#study-all').onclick=()=>cards.forEach(c=>setMode(c,'study'));
document.querySelector('#play-all').onclick=()=>{desiredPlaying=true;cards.forEach(c=>{if(!c.video.hidden)play(c.video)});updateOverall();};document.querySelector('#pause-all').onclick=()=>{desiredPlaying=false;cards.forEach(c=>c.video.pause());status.textContent='전체 일시정지 · 원하는 캐릭터를 크게 볼 수 있어요.';};document.querySelector('#restart-all').onclick=()=>{cards.forEach(c=>{if(!c.video.hidden){c.video.currentTime=0;if(desiredPlaying)play(c.video);}});updateOverall();};
document.querySelector('#page-step').onclick=()=>{desiredPlaying=false;cards.forEach(c=>{c.video.pause();if(!c.video.hidden){const firstTurn=record(c.id,c.mode).samples.find(s=>s.phase==='pageTurn');if(firstTurn)c.video.currentTime=firstTurn.clipSeconds+.75;}});status.textContent='페이지를 넘기는 자세 · 모두 재생을 누르면 이어서 움직여요.';};
fetch('capture/manifest.json').then(r=>{if(!r.ok)throw Error('capture manifest');return r.json();}).then(data=>{records=data;if(records.length!==10)throw Error('capture incomplete');gallery.replaceChildren();friends.forEach(([id,name])=>{const section=document.createElement('section');section.className='card';section.dataset.friend=id;section.innerHTML='<h2>'+name+'</h2><div class="modes"><button data-mode="rest" aria-pressed="true">휴식</button><button data-mode="study" aria-pressed="false">집중</button></div><div class="media"><video controls muted loop playsinline preload="auto" aria-label="'+name+' 모션"></video><img hidden alt=""></div><p class="meta"></p><p class="note"></p><button class="expand">크게 보기</button>';gallery.append(section);const card={id,name,section,mode:'rest',video:section.querySelector('video'),image:section.querySelector('img')};cards.set(id,card);section.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(card,b.dataset.mode));section.querySelector('.expand').onclick=()=>openDetail(card);});cards.forEach(c=>setMode(c,'rest'));}).catch(()=>{gallery.innerHTML='<p class="loading">모션 파일을 불러오지 못했어요. 페이지를 새로 열어 주세요.</p>';status.textContent='모션 파일 확인 필요';});
</script>
</html>
