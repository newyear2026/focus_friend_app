<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>작은 집중방 앱 아이콘 확인</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eee9df;color:#292630;font:16px system-ui,sans-serif;padding:48px}
main{max-width:960px;margin:auto}h1{font-size:28px;margin:0 0 12px}p{color:#665d64;margin:0 0 36px}
.row{display:flex;gap:48px;align-items:flex-end;margin-bottom:36px;flex-wrap:wrap}
figure{margin:0;text-align:center}.icon{background:#151e3b;overflow:hidden;width:240px;height:240px;display:grid;place-items:center}
.icon img{width:90%;height:90%;display:block;object-fit:contain}.circle{border-radius:50%}.rounded{border-radius:25%}
.small{width:96px;height:96px}.tiny{width:48px;height:48px}figcaption{margin-top:16px;font-size:14px;color:#665d64}
</style><main>
<h1>작은 집중방 · 비 오는 밤 아이콘</h1>
<p>그림과 여백은 Android 적응형 아이콘 리소스의 표시 비율을 반영한 CSS 미리보기입니다.</p>
<div class="row"><figure><div class="icon circle"><img src="generated-original.png" alt="원형 아이콘"></div><figcaption>원형</figcaption></figure>
<figure><div class="icon rounded"><img src="generated-original.png" alt="둥근 사각형 아이콘"></div><figcaption>둥근 사각형</figcaption></figure>
<figure><div class="icon rounded small"><img src="generated-original.png" alt="96픽셀 아이콘"></div><figcaption>96px</figcaption></figure>
<figure><div class="icon circle tiny"><img src="generated-original.png" alt="48픽셀 아이콘"></div><figcaption>48px</figcaption></figure></div>
</main></html>
