<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마시는 전후 · 전신 흔들림 확인</title><style>@font-face{font-family:Pretendard;src:url('/assets/fonts/PretendardVariable.ttf')}*{box-sizing:border-box}body{margin:0;background:#fff8eb;color:#382b26;font-family:Pretendard,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}p{line-height:1.6;color:#756458}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{font:inherit;padding:11px 13px;min-height:44px;background:#fffaf1;border:1px solid #dbc6a6;border-radius:10px;cursor:pointer}button[aria-pressed=true]{background:#ffc779}button:focus-visible{outline:3px solid #896847}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}video{display:block;width:100%;aspect-ratio:490/462;border-radius:14px;background:#48382e}.note{font-size:14px}.status{background:#f5ebd8;padding:12px 16px;border-radius:10px}a{color:#80552d}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><main><h1>마시는 전후 · 전신 흔들림 확인</h1><p>문제가 확인됐어요. 마시는 원화로 바뀔 때 머리·어깨·몸통·꼬리 윤곽도 달라져요. 현재 앱을 새로 캡처한 영상이에요.</p><div class="controls"><button data-time="8.416667">① 마시기 직전</button><button data-time="8.5">중간 원화 A</button><button data-time="8.75">중간 원화 B</button><button data-time="9.5">② 한 모금 유지</button><button data-time="10.75">③ 복귀 중</button><button id="play">전후 연결 재생 · 1배</button></div><div class="grid"><section><h2>다람쥐</h2><video src="capture/squirrel.mp4" data-friend="squirrel" muted controls loop playsinline preload="auto"></video></section><section><h2>사막여우</h2><video src="capture/fennec.mp4" data-friend="fennec" muted controls loop playsinline preload="auto"></video></section></div><p id="status" class="status" role="status">입에 대는 8.5~9초와 복귀하는 10.5~11초의 원화 교체를 비교해 보세요.</p><p class="note">9~10.5초의 한 모금 유지 구간은 같은 그림으로 정지해 있어요. 전신 흔들림은 마시는 자세에 들어가고 돌아오는 전환에서 확인돼요. 속도를 바꾸는 것만으로 원화의 형태 차이가 해결되지는 않아요.</p><p class="note"><a href="README.md">이번 점검 결과와 근거</a> · <a href="mouth-transition-app-contact.jpg">인접 원화 4장 비교</a></p></main><script>const videos=[...document.querySelectorAll('video')];document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{videos.forEach(v=>{v.pause();v.currentTime=Number(b.dataset.time)});document.querySelectorAll('[data-time]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#status').textContent=b.textContent+' · '+Number(b.dataset.time).toFixed(2)+'초'});document.querySelector('#play').onclick=()=>{videos.forEach(v=>{v.currentTime=7.5;v.play()});document.querySelectorAll('[data-time]').forEach(x=>x.setAttribute('aria-pressed','false'));document.querySelector('#status').textContent='7.5초부터 원래 속도로 재생 중 · 몸통과 꼬리 윤곽을 함께 보세요.'};</script></html>
