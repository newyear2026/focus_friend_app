<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>작은 집중방 · 현재 휴식 모션</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7e6;color:#342c29;font-family:system-ui,-apple-system,sans-serif}main{max-width:760px;margin:24px auto;padding:20px}h1{font-size:25px;margin:0 0 12px}p{line-height:1.65}video{display:block;width:min(100%,390px);margin:24px auto;border-radius:24px;background:#342c29}nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:1px solid #cfa675;background:#ffca7c;color:#362a24;border-radius:12px;padding:11px 17px;font:inherit;cursor:pointer}.note{font-size:14px;color:#71655b}a{color:#6d4828}
</style>
<main>
<h1>현재 앱의 휴식 모션</h1>
<p>책상 앞에서 찻잔을 들고 쉬다가, 컵을 들어 한 모금 마시고 다시 내리는 모습입니다. 그림 14장으로 10초마다 반복합니다.</p>
<video id="preview" src="rest-full-cycle.mp4?v=1" controls autoplay muted loop playsinline aria-label="현재 앱 휴식 화면의 10초 차 마시기 모션"></video>
<nav><button data-time="0">처음부터 보기</button><button data-time="3.5">차 마시기 보기</button></nav>
<p class="note">현재 앱과 같은 Flutter 위젯을 렌더한 미리보기입니다. 모션은 앱과 같은 1배 속도이며, 화면의 휴식 타이머는 비교하기 쉽도록 05:00에 고정했습니다.</p>
<p class="note"><a href="../calm-connected-motion/">필기 모션 보기</a></p>
</main>
<script>
const video=document.querySelector('video');for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>{video.currentTime=Number(button.dataset.time);video.play();});
</script>
</html>
