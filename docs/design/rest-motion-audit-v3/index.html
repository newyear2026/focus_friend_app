<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>휴식 모션 정밀 점검</title><style>@font-face{font-family:Pretendard;src:url('/assets/fonts/PretendardVariable.ttf')}*{box-sizing:border-box}body{margin:0;background:#fff8e9;color:#352724;font-family:Pretendard,system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:24px 20px}h1{font-size:26px;margin:0 0 10px}p{line-height:1.6;color:#756458}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{font:inherit;padding:11px 13px;border:1px solid #d5c3a4;background:#fffaf0;border-radius:11px;min-height:44px;cursor:pointer}button:focus-visible{outline:3px solid #806342}button[aria-pressed="true"]{background:#ffc16f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}h2{font-size:20px;margin:0 0 10px}video{width:100%;aspect-ratio:490/462;display:block;border-radius:14px;background:#493c34}.note{font-size:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style><main><h1>휴식 모션 정밀 점검</h1><p>이번 점검에서 실제 앱을 두 주기 새로 캡처했어요. 중간 자세와 반복 경계를 멈춰 비교할 수 있어요.</p><div class="actions"><button id="before">수정 전 보기</button><button id="after" aria-pressed="true">보정 후 보기</button><button data-step="blink">① 대기·눈 깜빡임</button><button data-step="lift">② 잔 올리는 중간</button><button data-step="sip">③ 한 모금</button><button data-step="lower">④ 잔 내리는 중간</button><button data-step="wrap">⑤ 반복 직전</button><button data-step="next">⑥ 반복 직후</button><button id="play">원래 속도로 전체 재생</button></div><div class="grid"><section><h2>랫서팬더 · 기준</h2><video data-friend="redpanda" src="after/redpanda.mp4" muted controls loop playsinline preload="auto"></video></section><section><h2>다람쥐</h2><video data-friend="squirrel" src="after/squirrel.mp4" muted controls loop playsinline preload="auto"></video></section><section><h2>사막여우</h2><video data-friend="fennec" src="after/fennec.mp4" muted controls loop playsinline preload="auto"></video></section></div><p id="status" role="status" class="note">보정 후 · 크기 변화와 역방향 자세를 줄였어요. 큰 자세 간격은 추가 작화가 필요해요.</p><p class="note">캐릭터 크기는 실제 앱 배치를 유지했어요. 영상 속도는 1배예요.</p><p class="note"><a href="README.md">점검 결과와 남은 문제</a></p></main><script>const videos=[...document.querySelectorAll('video')];let version='after'; const times={blink:[2.58,2.96],lift:[4.05,6.50],sip:[5.25,9],lower:[6.3,12.08],wrap:[9.92,21.92],next:[10.08,22.08]};document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-step]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));videos.forEach(v=>{v.pause();v.currentTime=times[b.dataset.step][v.dataset.friend==='redpanda'?0:1]});document.querySelector('#status').textContent=(version==='after'?'보정 후 · ':'수정 전 · ')+b.textContent+' · 실제 앱 원래 속도의 해당 자세'});function switchVersion(next){version=next;videos.forEach(v=>{v.pause();v.src=version+'/'+v.dataset.friend+'.mp4';v.load()});document.querySelector('#status').textContent=(version==='after'?'보정 후 · 일부 자세 간격은 추가 작화가 필요해요.':'수정 전 · 이번 점검에서 새로 캡처한 영상이에요.');document.querySelector('#before').setAttribute('aria-pressed',String(version==='before'));document.querySelector('#after').setAttribute('aria-pressed',String(version==='after'))}document.querySelector('#before').onclick=()=>switchVersion('before');document.querySelector('#after').onclick=()=>switchVersion('after');document.querySelector('#play').onclick=()=>{document.querySelectorAll('[data-step]').forEach(x=>x.setAttribute('aria-pressed','false'));videos.forEach(v=>{v.currentTime=0;v.play()});document.querySelector('#status').textContent=(version==='after'?'보정 후 · ':'수정 전 · ')+'원래 속도로 두 주기를 재생 중이에요.'};</script></html>
