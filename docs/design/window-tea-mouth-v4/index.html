<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입에 닿는 찻잔 · 휴식 모션 수정</title>
<style>@font-face{font-family:Pretendard;src:url('/assets/fonts/PretendardVariable.ttf')}*{box-sizing:border-box}body{margin:0;background:#fff8e9;color:#352724;font-family:Pretendard,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px 20px}h1{font-size:26px;margin:0 0 10px}p{line-height:1.6;color:#756458}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{font:inherit;padding:11px 13px;border:1px solid #d5c3a4;background:#fffaf0;border-radius:11px;min-height:44px;cursor:pointer}button:focus-visible{outline:3px solid #806342}button[aria-pressed="true"]{background:#ffc16f}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}h2{font-size:20px;margin:0 0 10px}video{width:100%;aspect-ratio:490/462;display:block;border-radius:14px;background:#493c34}.note{font-size:14px}a{color:#805229}details{margin-top:20px}details video{max-width:360px;margin-top:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
<main><h1>입에 닿는 찻잔 · 휴식 모션 수정</h1><p>코 아래 입술에 잔을 대고, 살짝 기울여 한 모금 마셔요. 실제 앱에서 캡처한 원래 속도예요.</p>
<div class="actions"><button id="before">수정 전</button><button id="after" aria-pressed="true">수정 후</button><button data-time="6.5">잔 올리기</button><button data-time="8.58">입에 닿기</button><button data-time="9.5">한 모금</button><button data-time="12.08">잔 내리기</button><button data-time="21.92">반복 직전</button><button data-time="22.08">반복 직후</button><button id="play">전체 재생 · 1배</button></div>
<div class="grid"><section><h2>다람쥐</h2><video data-friend="squirrel" src="after/squirrel.mp4" muted controls loop playsinline preload="auto"></video></section><section><h2>사막여우</h2><video data-friend="fennec" src="after/fennec.mp4" muted controls loop playsinline preload="auto"></video></section></div>
<p id="status" role="status" class="note">수정 후 · 한 주기 22초 / 올리기 3.5초 / 한 모금 1.5초 / 내리기 3.5초</p><p class="note">책과 연필은 고정하고, 연결된 캐릭터 그림을 교체해 움직여요. 원화 사이의 작은 윤곽 차이는 남아 있어요.</p>
<details><summary>랫서팬더 기준 모션 보기</summary><video src="after/redpanda.mp4" muted controls loop playsinline preload="metadata"></video></details><p class="note"><a href="README.md">수정 내용과 검증 기록</a> · <a href="after/squirrel-sip-app.png">다람쥐 전체 앱</a> · <a href="after/fennec-sip-app.png">사막여우 전체 앱</a></p></main>
<script>
const videos=[...document.querySelectorAll('[data-friend]')];let version='after';
const status=document.querySelector('#status');
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-time]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));videos.forEach(v=>{v.pause();v.currentTime=Number(b.dataset.time)});status.textContent=(version==='after'?'수정 후 · ':'수정 전 · ')+b.textContent+' · '+b.dataset.time+'초'});
function switchVersion(next){const t=videos[0].currentTime;version=next;videos.forEach(v=>{v.pause();v.src=version+'/'+v.dataset.friend+'.mp4';v.addEventListener('loadedmetadata',()=>{v.currentTime=Math.min(t,v.duration-.1)},{once:true});v.load()});status.textContent=(version==='after'?'수정 후 · 입 높이에서 살짝 기울여 마셔요.':'수정 전 · 잔이 코 높이까지 올라가던 동작이에요.');document.querySelector('#before').setAttribute('aria-pressed',String(version==='before'));document.querySelector('#after').setAttribute('aria-pressed',String(version==='after'))}
document.querySelector('#before').onclick=()=>switchVersion('before');document.querySelector('#after').onclick=()=>switchVersion('after');
document.querySelector('#play').onclick=()=>{document.querySelectorAll('[data-time]').forEach(x=>x.setAttribute('aria-pressed','false'));videos.forEach(v=>{v.currentTime=0;v.play()});status.textContent=(version==='after'?'수정 후 · ':'수정 전 · ')+'원래 속도로 전체 재생 중이에요.'};
</script></html>
